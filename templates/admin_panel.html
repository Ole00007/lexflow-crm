{% extends "base.html" %}
{% block title %}Super Admin — Workspaces & Accounts{% endblock %}
{% block content %}
<div id="panelShell">
  <h1>Super Admin — All Workspaces</h1>
  <p class="intro" id="statusLine">Verifying access…</p>
  <div id="panelBody" style="display:none">
    <!-- workspaces injected by JS -->
  </div>

  <div class="card" style="margin-top:var(--space-6)">
    <h2>Reset a user's password</h2>
    <p class="intro">Email + new password. The user receives a notification email (no plaintext password is sent).</p>
    <div class="actions" style="margin-top:var(--space-4)">
      <input type="email" id="resetEmail" placeholder="user@email.com" style="padding:var(--space-2) var(--space-3);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text)">
      <input type="password" id="resetPw" placeholder="New password (min 6)" style="padding:var(--space-2) var(--space-3);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text)">
      <button class="button" id="resetBtn" onclick="doReset()">Reset password</button>
    </div>
    <p id="resetMsg" style="margin-top:var(--space-3);font-size:var(--text-sm)"></p>
  </div>
</div>

<script>
function token() { return localStorage.getItem('jwt') || ''; }
function esc(s) { var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function initPanel() {
  var status = document.getElementById('statusLine');
  var body = document.getElementById('panelBody');
  var t = token();
  if (!t) {
    status.textContent = 'Please log in first — redirecting…';
    setTimeout(function(){ window.location.href = '/'; }, 800);
    return;
  }
  fetch('/api/admin/workspaces', {headers: {'Authorization': 'Bearer ' + t}})
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
  .then(function(res){
    if (!res.ok) {
      status.textContent = 'Superadmin only — redirecting…';
      setTimeout(function(){ window.location.href = '/'; }, 800);
      return;
    }
    status.textContent = 'You are the only superadmin — this panel is not visible to client users.';
    var html = '';
    res.data.forEach(function(item){
      var ws = item.workspace;
      html += '<div class="card" style="margin-bottom:var(--space-6)">'
        + '<div class="eyebrow">Workspace #' + ws.id + '</div>'
        + '<h2 style="margin:0 0 var(--space-2)">' + esc(ws.name) + ' <span class="badge">' + esc(ws.slug) + '</span></h2>'
        + (ws.parent_workspace_id ? '<p class="intro">Sub-workspace of #' + ws.parent_workspace_id + '</p>' : '')
        + '<table><thead><tr><th>ID</th><th>Email (login)</th><th>Role</th><th>Created</th></tr></thead><tbody>';
      item.users.forEach(function(u){
        html += '<tr><td>' + u.id + '</td><td>' + esc(u.email) + '</td><td><span class="badge">' + esc(u.role) + '</span></td><td>' + (u.created_at ? u.created_at.slice(0,10) : '—') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    });
    body.innerHTML = html;
    body.style.display = 'block';
  })
  .catch(function(e){ status.textContent = 'Error: ' + e.message; });
}

function doReset() {
  var email = document.getElementById('resetEmail').value.trim();
  var pw = document.getElementById('resetPw').value;
  var msg = document.getElementById('resetMsg');
  var btn = document.getElementById('resetBtn');
  if (!email || pw.length < 6) { msg.textContent = 'Enter email + password (min 6 chars).'; return; }
  btn.disabled = true; btn.textContent = '…';
  fetch('/api/admin/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token()},
    body: JSON.stringify({email: email, new_password: pw})
  })
  .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, data: d}; }); })
  .then(function(res){
    if (res.ok) { msg.textContent = '✓ Password reset for ' + email + ' (notification email sent).'; msg.style.color = 'var(--success)'; }
    else { msg.textContent = '✕ ' + (res.data.error || 'Failed'); msg.style.color = 'var(--warning)'; }
  })
  .catch(function(e){ msg.textContent = 'Network error: ' + e.message; msg.style.color = 'var(--warning)'; })
  .finally(function(){ btn.disabled = false; btn.textContent = 'Reset password'; });
}
initPanel();
</script>
{% endblock %}
