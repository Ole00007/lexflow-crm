{% extends "base.html" %}
{% block title %}Tasks — LexFlow{% endblock %}
{% block content %}
<section class="card stack" aria-labelledby="page-title">
    <div class="section">
        <p class="eyebrow">Workflow</p>
        <h1 id="page-title">Tasks</h1>
        <p class="intro">Track tasks across all active cases.</p>
    </div>
    <div class="section" style="padding-top:0">
        <div id="taskList" style="display:grid;gap:8px">
            <p style="color:var(--text-muted)">Login to view tasks.</p>
        </div>
    </div>
</section>
<script>
const API = '';
function token() { return localStorage.getItem('jwt') || ''; }
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function load() {
  var t = token();
  if (!t) { return; }
  fetch(API + '/api/tasks/', {headers:{'Authorization':'Bearer '+t}})
  .then(r=>r.json())
  .then(tasks => {
    if (!tasks.length) { document.getElementById('taskList').innerHTML = '<p style="color:var(--text-muted)">No tasks yet. Create a case first.</p>'; return; }
    document.getElementById('taskList').innerHTML = tasks.map(t =>
      '<div style="border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center">' +
      '<div><strong>' + esc(t.title) + '</strong><br><span style="color:var(--text-muted);font-size:var(--text-sm)">Case #' + t.caseid + (t.duedate ? ' · Due: ' + t.duedate.slice(0,10) : '') + '</span></div>' +
      '<div><span class="badge">' + esc(t.status) + '</span></div></div>'
    ).join('')
  })
  .catch(e => {});
}
load();
</script>
{% endblock %}
