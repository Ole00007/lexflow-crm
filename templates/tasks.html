{% extends "base.html" %}
{% block title %}Tasks — LexFlow{% endblock %}
{% block content %}
<style>
.task-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;box-shadow:var(--shadow-md);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1.05rem;font-weight:700;color:var(--text);margin:0}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-size:.9rem;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.72rem;color:var(--text-faint);margin-top:4px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
.btn{padding:8px 16px;border-radius:var(--radius-md);font-size:.85rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all var(--transition)}
.btn-cancel{background:transparent;border-color:var(--border);color:var(--text-muted)}
.btn-cancel:hover{color:var(--text)}
.btn-submit{background:var(--accent);color:#fff}
.btn-submit:hover{background:var(--accent-h)}
.task-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.task-card .del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1.1rem;padding:4px;line-height:1}
.task-card .del:hover{color:var(--danger)}
</style>

<section class="card stack" aria-labelledby="page-title">
    <div class="section">
        <p class="eyebrow">Workflow</p>
        <h1 id="page-title">Tasks</h1>
        <p class="intro">Track tasks across all active cases.</p>
    </div>
    <div class="section" style="padding-top:0">
        <div class="task-toolbar">
            <button class="button" onclick="openModal()">+ New Task</button>
        </div>
        <div id="taskList" style="display:grid;gap:8px">
            <p style="color:var(--text-muted)">Login to view tasks.</p>
        </div>
    </div>
</section>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>New Task</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="taskTitle">Title *</label>
        <input type="text" id="taskTitle" placeholder="Task title" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="taskCaseId">Case ID *</label>
          <input type="number" id="taskCaseId" placeholder="Case ID">
        </div>
        <div class="form-group">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="taskStatus">Status</label>
          <select id="taskStatus">
            <option value="pending" selected>Pending</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskDue">Due Date</label>
          <input type="date" id="taskDue">
        </div>
      </div>
      <div class="form-group">
        <label for="taskDesc">Description</label>
        <textarea id="taskDesc" rows="3" placeholder="Optional details"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-submit" onclick="handleCreate()">Create</button>
    </div>
  </div>
</div>

<script>
const API = '';
function token() { return localStorage.getItem('jwt') || ''; }
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

function load() {
  var t = token();
  if (!t) {
    document.getElementById('taskList').innerHTML = '<p style="color:var(--text-muted)">Login to view tasks.</p>';
    return;
  }
  fetch(API + '/api/tasks/', {headers:{'Authorization':'Bearer '+t}})
  .then(r=>r.json())
  .then(tasks => {
    if (!tasks.length) { document.getElementById('taskList').innerHTML = '<p style="color:var(--text-muted)">No tasks yet. Use "+ New Task" to create one.</p>'; return; }
    document.getElementById('taskList').innerHTML = tasks.map(t =>
      '<div class="task-card">' +
        '<div><strong>' + esc(t.title) + '</strong><br>' +
        '<span style="color:var(--text-muted);font-size:var(--text-sm)">Case #' + t.caseid +
        (t.duedate ? ' · Due: ' + t.duedate.slice(0,10) : '') + '</span></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span class="badge">' + esc(t.status) + '</span>' +
          '<button class="del" title="Delete task" onclick="delTask(' + t.id + ')">&times;</button>' +
        '</div>' +
      '</div>'
    ).join('');
  })
  .catch(function(){ document.getElementById('taskList').innerHTML = '<p style="color:var(--text-muted)">Failed to load tasks.</p>'; });
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskCaseId').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskDue').value = '';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function handleCreate() {
  var title = document.getElementById('taskTitle').value.trim();
  var caseid = parseInt(document.getElementById('taskCaseId').value, 10);
  if (!title || !caseid) { alert('Title and Case ID are required'); return; }
  var body = {
    title: title,
    caseid: caseid,
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value
  };
  var due = document.getElementById('taskDue').value;
  if (due) body.duedate = due;
  var desc = document.getElementById('taskDesc').value.trim();
  if (desc) body.description = desc;

  fetch(API + '/api/tasks/', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+token()},
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
  .then(function(res){
    if (res.ok) {
      closeModal();
      load();
      toast('Task created!', 'success');
    } else {
      alert(res.data.error || 'Failed to create task');
    }
  })
  .catch(function(e){ alert('Network error: ' + e.message); });
}

function delTask(id) {
  if (!confirm('Delete this task?')) return;
  fetch(API + '/api/tasks/' + id, {
    method: 'DELETE',
    headers: {'Authorization':'Bearer '+token()}
  })
  .then(function(r){
    if (r.ok) { load(); toast('Task deleted', 'success'); }
    else alert('Failed to delete task');
  })
  .catch(function(e){ alert('Network error: ' + e.message); });
}

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
load();
</script>
{% endblock %}
